<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUNPARTS · Editor de Preços</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#111;color:#eee;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh}
  #gate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
  #gate h1{color:#ff8c00;font-size:22px;letter-spacing:2px}
  #gate input{background:#1a1a1a;border:1px solid #333;color:#eee;padding:12px 18px;border-radius:8px;width:280px;font-size:15px;outline:none}
  #gate input:focus{border-color:#ff8c00}
  #gate button{background:#ff8c00;color:#000;border:none;padding:12px 32px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px}
  #gate button:hover{background:#e07800}
  #app{display:none;padding:24px;max-width:900px;margin:0 auto}
  .header{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .header h1{color:#ff8c00;font-size:20px;letter-spacing:2px;flex:1}
  .btn-save{background:#ff8c00;color:#000;border:none;padding:10px 28px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
  .btn-save:hover{background:#e07800}
  .btn-save:disabled{background:#555;cursor:default;color:#888}
  .status{font-size:13px;color:#888}
  .status.ok{color:#4caf50}
  .status.err{color:#f44}
  table{width:100%;border-collapse:collapse;background:#1a1a1a;border-radius:10px;overflow:hidden}
  thead tr{background:#222;border-bottom:2px solid #ff8c00}
  th{padding:12px 14px;text-align:left;font-size:11px;letter-spacing:1px;color:#ff8c00;font-weight:700}
  td{padding:10px 14px;border-bottom:1px solid #252525;font-size:13px}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#202020}
  .label{color:#aaa;font-size:13px}
  input[type=number]{background:#252525;border:1px solid #333;color:#eee;padding:7px 10px;border-radius:6px;width:110px;font-size:14px;text-align:right}
  input[type=number]:focus{border-color:#ff8c00;outline:none;background:#2a2a2a}
  .sym{color:#888;font-size:12px;margin-right:4px}
  .section-title{color:#555;font-size:11px;letter-spacing:2px;padding:10px 14px 4px;background:#161616;border-bottom:1px solid #222}
  .diff{color:#f90;font-size:11px;margin-left:6px}
</style>
</head>
<body>

<div id="gate">
  <h1>FUNPARTS · PREÇOS</h1>
  <input type="password" id="pat" placeholder="GitHub PAT (ghp_...)" autocomplete="off"/>
  <input type="password" id="senha" placeholder="Senha admin" autocomplete="off"/>
  <button onclick="entrar()">ENTRAR</button>
  <div id="gateErr" style="color:#f44;font-size:13px"></div>
</div>

<div id="app">
  <div class="header">
    <h1>FUNPARTS · EDITOR DE PREÇOS</h1>
    <span id="status" class="status">Carregando...</span>
    <button class="btn-save" id="btnSave" onclick="salvar()" disabled>SALVAR ALTERAÇÕES</button>
  </div>
  <table id="tbl">
    <thead>
      <tr>
        <th style="width:34%">ITEM</th>
        <th><span class="sym">R$</span> BRASIL</th>
        <th><span class="sym">€</span> EUROPA</th>
        <th><span class="sym">$</span> EUA</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const REPO = 'rodox1209-ui/funparts-v12';
const FILE = 'fp_addons.js';
const SENHA_HASH = ''; // preenchido no carregamento

const ITEMS = [
  {key:'lego_base_carbono', label:'LEGO — Fundo Fibra de Carbono', section:'LEGO BASE'},
  {key:'lego_base_fosco',   label:'LEGO — Fundo Fosco',             section:''},
  {key:'mini_base_P',       label:'Mini — Tamanho P',               section:'MINI BASE'},
  {key:'mini_base_M',       label:'Mini — Tamanho M',               section:''},
  {key:'mini_base_G',       label:'Mini — Tamanho G',               section:''},
  {key:'opt_moldura_fibra', label:'+ Moldura Fibra de Carbono',     section:'OPCIONAIS'},
  {key:'opt_led_rgb_sem',   label:'+ LED RGB Sem Fio',              section:''},
  {key:'opt_led_rgb_com',   label:'+ LED RGB Com Fio',              section:''},
  {key:'opt_led_warm_sem',  label:'+ LED Warm Sem Fio',             section:''},
  {key:'opt_led_warm_com',  label:'+ LED Warm Com Fio',             section:''},
  {key:'opt_relevo_bandeira',label:'+ Alto Relevo Bandeira',        section:''},
  {key:'opt_relevo_piloto', label:'+ Alto Relevo Piloto',           section:''},
];

let _pat = '', _sha = '', _rawContent = '', _prices = {BR:{}, EU:{}, US:{}};

function entrar(){
  const pat = document.getElementById('pat').value.trim();
  const senha = document.getElementById('senha').value.trim();
  if(!pat.startsWith('ghp_') && !pat.startsWith('github_pat_')){
    document.getElementById('gateErr').textContent = 'PAT inválido (deve começar com ghp_...)';
    return;
  }
  if(senha.length < 4){
    document.getElementById('gateErr').textContent = 'Senha muito curta';
    return;
  }
  _pat = pat;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  carregar();
}

async function carregar(){
  setStatus('Carregando fp_addons.js...', '');
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE, {
      headers: {Authorization:'token '+_pat, Accept:'application/vnd.github.v3+json'}
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    _sha = d.sha;
    _rawContent = atob(d.content.replace(/\n/g,''));
    extrairPrecos();
    renderTabela();
    setStatus('Preços carregados ✓', 'ok');
    document.getElementById('btnSave').disabled = false;
  } catch(e){
    setStatus('Erro: ' + e.message, 'err');
  }
}

function extrairPrecos(){
  // Parse prices from CFG object in fp_addons.js
  const regions = ['BR','EU','US'];
  regions.forEach(reg => {
    _prices[reg] = {};
    // Find prices:{...} block for this region
    const marker = "prices:{";
    // Find the region block
    const regIdx = _rawContent.indexOf(reg + ':{');
    if(regIdx < 0) return;
    const pricesIdx = _rawContent.indexOf('prices:{', regIdx);
    if(pricesIdx < 0) return;
    const start = pricesIdx + 7;
    const end = _rawContent.indexOf('}', start);
    const block = _rawContent.slice(start, end);
    // Parse key:value pairs
    block.split(',').forEach(pair => {
      const [k, v] = pair.split(':');
      if(k && v) _prices[reg][k.trim()] = parseInt(v.trim(), 10);
    });
  });
}

function renderTabela(){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let lastSection = '';
  ITEMS.forEach(item => {
    if(item.section && item.section !== lastSection){
      lastSection = item.section;
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="4" class="section-title">' + item.section + '</td>';
      tbody.appendChild(tr);
    }
    const br = _prices.BR[item.key] || 0;
    const eu = _prices.EU[item.key] || 0;
    const us = _prices.US[item.key] || 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="label">${item.label}</td>
      <td><input type="number" id="br_${item.key}" value="${br}" min="0" max="99999" onchange="markDirty()"></td>
      <td><input type="number" id="eu_${item.key}" value="${eu}" min="0" max="99999" onchange="markDirty()"></td>
      <td><input type="number" id="us_${item.key}" value="${us}" min="0" max="99999" onchange="markDirty()"></td>
    `;
    tbody.appendChild(tr);
  });
}

function markDirty(){
  document.getElementById('status').textContent = 'Alterações não salvas';
  document.getElementById('status').className = 'status';
}

function lerPrecos(){
  const p = {BR:{}, EU:{}, US:{}};
  ITEMS.forEach(item => {
    p.BR[item.key] = parseInt(document.getElementById('br_' + item.key).value) || 0;
    p.EU[item.key] = parseInt(document.getElementById('eu_' + item.key).value) || 0;
    p.US[item.key] = parseInt(document.getElementById('us_' + item.key).value) || 0;
  });
  return p;
}

function gerarPricesStr(obj){
  return 'prices:{' + Object.entries(obj).map(([k,v]) => k + ':' + v).join(',') + '}';
}

function atualizarConteudo(content, p){
  // Replace each region's prices block
  ['BR','EU','US'].forEach(reg => {
    const regIdx = content.indexOf(reg + ':{');
    if(regIdx < 0) return;
    const pricesIdx = content.indexOf('prices:{', regIdx);
    if(pricesIdx < 0) return;
    const end = content.indexOf('}', pricesIdx);
    const oldBlock = content.slice(pricesIdx, end + 1);
    const newBlock = gerarPricesStr(p[reg]);
    content = content.slice(0, pricesIdx) + newBlock + content.slice(end + 1);
  });
  return content;
}

async function salvar(){
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  setStatus('Salvando...', '');
  try {
    const p = lerPrecos();
    const newContent = atualizarConteudo(_rawContent, p);
    
    // Encode to base64
    const bytes = new TextEncoder().encode(newContent);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    const encoded = btoa(bin);
    
    const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE, {
      method: 'PUT',
      headers: {Authorization:'token '+_pat, 'Content-Type':'application/json'},
      body: JSON.stringify({
        message: 'update: preços regionais BR/EU/US via admin-precos',
        content: encoded,
        sha: _sha
      })
    });
    if(!r.ok){
      const err = await r.json();
      throw new Error(err.message || 'HTTP ' + r.status);
    }
    const d = await r.json();
    _sha = d.content.sha; // Update SHA for next save
    _prices = p;
    setStatus('✓ Salvo · commit ' + d.commit.sha.slice(0,8) + ' · deploy em ~2min', 'ok');
  } catch(e){
    setStatus('Erro: ' + e.message, 'err');
  }
  btn.disabled = false;
}

function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

// Enter key on password fields
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.getElementById('gate').style.display !== 'none') entrar();
});
</script>
</body>
</html>
